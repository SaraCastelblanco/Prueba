<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones basicas con JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div id="header">HEADER</div>
        <div id="nav">Botones de navegación</div>
        <div id="content">
            <form class="centrar">
                <input type="text" id="num1" placeholder="Digite número">
                <select name="" id="operador">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">/</option>
                </select>
                <input type="text" id="num2" placeholder="Digite número">
                <p>
                    <input type="text" id="resultado" placeholder="Resultado">
                </p>
                <p>
                    <input type="button" value="calcular" onclick="f_operar()">
                </p>
            </form>
            
        </div>
        <div id="footer"> &copy; Copyright Sara </div>
    </div>   
    <script src="operaciones.js"></script> 
</body>
</html>
